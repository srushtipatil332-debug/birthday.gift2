<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Mansi 🎂</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  text-align: center;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
  overflow: hidden;
}

.container {
  position: relative;
  z-index: 2;
  padding: 20px;
  color: white;
}

h1 {
  font-size: 2.5rem;
  margin-top: 20px;
}

.note {
  font-size: 1.2rem;
  margin: 20px;
  padding: 15px;
  background: rgba(255,255,255,0.2);
  border-radius: 15px;
}

/* Cake */
.cake {
  margin: 40px auto;
  width: 150px;
  height: 150px;
  position: relative;
}

.layer {
  width: 150px;
  height: 50px;
  background: #ff6f61;
  border-radius: 10px;
  position: absolute;
}

.layer:nth-child(1) { top: 100px; }
.layer:nth-child(2) { top: 60px; background: #ff8a75; }
.layer:nth-child(3) { top: 20px; background: #ffa69e; }

.candle {
  width: 10px;
  height: 30px;
  background: white;
  position: absolute;
  top: -10px;
  left: 70px;
}

.flame {
  width: 10px;
  height: 15px;
  background: gold;
  border-radius: 50%;
  position: absolute;
  top: -15px;
  left: 0;
  animation: flicker 0.5s infinite alternate;
}

@keyframes flicker {
  from { transform: scale(1); }
  to { transform: scale(1.2); }
}

/* Confetti */
.confetti {
  position: absolute;
  width: 10px;
  height: 10px;
  background: red;
  top: -10px;
  animation: fall linear infinite;
}

@keyframes fall {
  to {
    transform: translateY(100vh) rotate(360deg);
  }
}
</style>
</head>

<body>

<div class="container">
  <h1>🎉 Happy Birthday Mansi 🎉</h1>

  <div class="cake">
    <div class="layer"></div>
    <div class="layer"></div>
    <div class="layer"></div>
    <div class="candle">
      <div class="flame"></div>
    </div>
  </div>

  <div class="note">
    Dear Mansi 💖<br><br>
    You are not just special… you are the main character of today’s story ✨  
    May your day be filled with laughter, surprises, and a little bit of magic 🎁  
    Keep shining, keep smiling, and never forget how amazing you are 🌟  
    <br><br>
    Happy Birthday once again 🎂💫
  </div>
</div>

<script>
// Confetti generator
function createConfetti() {
  const confetti = document.createElement('div');
  confetti.classList.add('confetti');

  confetti.style.left = Math.random() * window.innerWidth + 'px';
  confetti.style.backgroundColor = 
    ['#ff0', '#f0f', '#0ff', '#0f0', '#f00'][Math.floor(Math.random()*5)];

  confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';

  document.body.appendChild(confetti);

  setTimeout(() => confetti.remove(), 5000);
}

setInterval(createConfetti, 150);
</script>

</body>
</html>
